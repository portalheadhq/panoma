name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Model logic, the generated Hyprland file, and what `omarchy plugin
      # add` checks on install (manifest, entry points, no symlinks), plus the
      # translation catalogues.
      - run: node test.js
